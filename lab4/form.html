<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html">
            <img src="images/logo.jpg" alt="Логотип книжного магазина" width="150" height="50">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="form.html">Форма обратной связи</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">
        <section>
            <h1>Оформление заказа</h1>
            
            <div class="form-container">
                <form id="orderForm" action="#" method="post">
                    <div class="form-group">
                        <h2>Личные данные</h2>
                        
                        <div class="form-row">
                            <label for="fio">ФИО покупателя:</label>
                            <input type="text" id="fio" name="fio" required>
                        </div>
                        
                        <div class="form-row">
                            <label for="address">Адрес доставки:</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        
                        <div class="form-row">
                            <label for="phone">Телефон:</label>
                            <input type="text" id="phone" name="phone" placeholder="+7(999)999-99-99" required>
                        </div>
                        
                        <div class="form-row">
                            <label for="email">Адрес электронной почты:</label>
                            <input type="text" id="email" name="email" placeholder="example@mail.ru" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <h2>Книги для покупки</h2>
                        
                        <div class="checkbox-group">
                            <div>
                                <input type="checkbox" id="book1" name="books" value="Николай Соболев. Путь к успеху">
                                <label for="book1">Николай Соболев. Путь к успеху</label>
                            </div>
                            
                            <div>
                                <input type="checkbox" id="book2" name="books" value="Джейсон Стэтхем. Большая книга цитат">
                                <label for="book2">Джейсон Стэтхем. Большая книга цитат</label>
                            </div>
                            
                            <div>
                                <input type="checkbox" id="book3" name="books" value="Инстасамка. Хайп в Инстаграм">
                                <label for="book3">Инстасамка. Хайп в Инстаграм</label>
                            </div>
                            
                            <div>
                                <input type="checkbox" id="book4" name="books" value="Богатый папа, бедный папа">
                                <label for="book4">Богатый папа, бедный папа</label>
                            </div>
                            
                            <div>
                                <input type="checkbox" id="book5" name="books" value="Дежавю">
                                <label for="book5">Дежавю</label>
                            </div>
                            
                            <div>
                                <input type="checkbox" id="book6" name="books" value="Мятная сказка">
                                <label for="book6">Мятная сказка</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <h2>Способ оплаты</h2>
                        
                        <div class="radio-group">
                            <div>
                                <input type="radio" id="cash" name="payment" value="Наличными при получении" checked>
                                <label for="cash">Наличными при получении</label>
                            </div>
                            
                            <div>
                                <input type="radio" id="card" name="payment" value="Картой при получении">
                                <label for="card">Картой при получении</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <h2>День доставки</h2>
                        
                        <div class="form-row">
                            <label for="delivery_day">Выберите день:</label>
                            <select id="delivery_day" name="delivery_day">
                                <option value="Понедельник">Понедельник</option>
                                <option value="Среда">Среда</option>
                                <option value="Пятница">Пятница</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <h2>Комментарий курьеру</h2>
                        
                        <div class="form-row">
                            <label for="comment">Комментарий:</label>
                            <textarea id="comment" name="comment" rows="5" cols="40" wrap="soft"></textarea>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <input type="submit" value="Заказать">
                        <input type="reset" value="Очистить форму">
                    </div>
                </form>
            </div>

            <!-- Контейнер для карточек заказов -->
            <div class="orders-container" id="ordersContainer">
                <h2>История заказов</h2>
                <div class="orders-grid" id="ordersGrid">
                    <!-- Сюда будут добавляться карточки заказов -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="https://miet.ru" target="_blank">
            <img src="images/logo-miet.jpg" alt="Логотип НИУ МИЭТ" width="100" height="50">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="form.html">Форма обратной связи</a></li>
            </ul>
        </nav>
    </footer>

    <script src="script.js"></script>
</body>
</html>
