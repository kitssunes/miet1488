<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="Логотип книжного магазина" width="150" height="50">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="form.html">Форма обратной связи</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Оформление заказа</h1>
            
            <form action="#" method="post">
                <div>
                    <h2>Личные данные</h2>
                    
                    <div>
                        <label for="fio">ФИО покупателя:</label>
                        <input type="text" id="fio" name="fio" required>
                    </div>
                    
                    <div>
                        <label for="address">Адрес доставки:</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div>
                        <label for="phone">Телефон:</label>
                        <input type="text" id="phone" name="phone" required>
                    </div>
                    
                    <div>
                        <label for="email">Адрес электронной почты:</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                </div>

                <div>
                    <h2>Книги для покупки</h2>
                    
                    <div>
                        <input type="checkbox" id="book1" name="books" value="sobolev">
                        <label for="book1">Николай Соболев. Путь к успеху - Николай Соболев</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="book2" name="books" value="statham">
                        <label for="book2">Джейсон Стэтхем. Большая книга цитат - Джейсон Стэтхем</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="book3" name="books" value="instasamka">
                        <label for="book3">Инстасамка. Хайп в Инстаграм - Инстасамка</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="book4" name="books" value="kiyosaki">
                        <label for="book4">Богатый папа, бедный папа - Роберт Кийосаки</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="book5" name="books" value="kizaru">
                        <label for="book5">Дежавю - Кизару</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="book6" name="books" value="polyarniy">
                        <label for="book6">Мятная сказка - Александр Полярный</label>
                    </div>
                </div>

                <div>
                    <h2>Способ оплаты</h2>
                    
                    <div>
                        <input type="radio" id="cash" name="payment" value="cash" checked>
                        <label for="cash">Наличными при получении</label>
                    </div>
                    
                    <div>
                        <input type="radio" id="card" name="payment" value="card">
                        <label for="card">Картой при получении</label>
                    </div>
                </div>

                <div>
                    <h2>День доставки</h2>
                    
                    <label for="delivery_day">Выберите день:</label>
                    <select id="delivery_day" name="delivery_day">
                        <option value="monday">Понедельник</option>
                        <option value="wednesday">Среда</option>
                        <option value="friday">Пятница</option>
                    </select>
                </div>

                <div>
                    <h2>Комментарий курьеру</h2>
                    
                    <textarea id="comment" name="comment" rows="5" cols="40" wrap="soft"></textarea>
                </div>

                <div>
                    <input type="submit" value="Заказать">
                    <input type="reset" value="Очистить форму">
                </div>
            </form>
        </section>
    </main>

    <footer>
        <a href="https://miet.ru" target="_blank">
            <img src="images/logo-miet.png" alt="Логотип НИУ МИЭТ" width="100" height="50">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="form.html">Форма обратной связи</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
